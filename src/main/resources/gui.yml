# UItem GUI configuration
# Supports MiniMessage formatting in names/lore.

# Generic navigation buttons (used across all GUIs)
back-button:
  material: ARROW
  name: "<yellow>\u2190 Back"
  lore:
    - "<gray>Click to go back"

prev-page:
  material: ARROW
  name: "<yellow>\u25c0 Previous page"

next-page:
  material: ARROW
  name: "<yellow>Next page \u25b6"
