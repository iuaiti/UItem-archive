# +------------------------------------------+
# |       UItem - Main Configuration         |
# +------------------------------------------+

# All player-facing strings live in lang.yml (English).
# Edit values there to customize messages; keys must stay unchanged.

# Chat prefix used by plugin messages
prefix: "<gradient:#ff6b6b:#ffd93d><bold>UItem</bold></gradient> <dark_gray>| "

# Auto-save items when editing via GUI
auto-save: true

# Allow MiniMessage in display name and lore
minimessage-support: true

# Storage behavior for items and recipes
storage:
  # If true: GUI maintains consolidated item.yml / recipe.yml
  # If false (recommended): Only individual files (items/<id>.yml) are used.
  use-consolidated-files: false

# GUI search configuration
gui:
  search:
    enabled: true   # Toggle search button in item list GUI
  items-per-page: 28  # Number of items per page in list

# Permissions
permissions:
  search: "uitem.search"

# Wizard (new item creation flow)
wizard:
  enable-from-hand: true   # Allow "Item in hand" option in wizard

# Provider configuration
# Providers are auto-detected when the plugin starts:
#   - vanilla  (always available)
#   - ia       (ItemsAdder, if installed)
#   - oraxen   (Oraxen, if installed)
# To register additional providers, call ProviderManager.register() from code.

# Debug mode - log extra detailed info (useful when debugging provider reflection)
debug: false

# Rarities are stored in rarity.yml (separate file, easy to copy-paste)
