name: UItem
version: ${version}
main: com.uitem.UItemPlugin
api-version: '1.21'
folia-supported: true
description: Ultimate Item - Custom item plugin (logic-only, no resource pack)
author: iuaititi
softdepend: [Oraxen, ItemsAdder, AuraSkills, EcoSkills]
commands:
  uitem:
    description: UItem main command
    usage: /uitem|ui <give|editor|reload|list|check>
    aliases: [ui]
    permission: uitem.admin
permissions:
  uitem.admin:
    description: Full access to UItem
    default: op
    children:
      uitem.give: true
      uitem.editor: true
      uitem.reload: true
      uitem.search: true
      uitem.id: true
      uitem.bulkgive: true
  uitem.give:
    description: Allow giving custom items
    default: op
  uitem.editor:
    description: Allow opening item editor
    default: op
  uitem.reload:
    description: Allow reloading plugin
    default: op
  uitem.search:
    description: Allow using item search GUI
    default: op
  uitem.id:
    description: View internal item IDs
    default: false
  uitem.bulkgive:
    description: Allow bulk give GUI
    default: op

# =============================================================
# UItem Public API
# Entry point: com.uitem.api.UItemAPI
# Providers: com.uitem.provider.ProviderManager
# Events:
#   - UItemCreateEvent, UItemDeleteEvent, UItemGiveEvent
#   - UItemInteractEvent, UItemPickupEvent, UItemEquipEvent
# =============================================================
