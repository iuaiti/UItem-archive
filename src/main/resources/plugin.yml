name: UItem
version: ${version}
main: com.uitem.UItemPlugin
api-version: '1.21'
folia-supported: true
description: Ultimate Item - Custom items for Paper 1.21.4 through 1.26.2 (Folia supported)
author: iuaititi
softdepend: [Oraxen, Nexo, ItemsAdder, SCore, ExecutableItems]
license: All Rights Reserved (DSL v1.0 - No Redistribution)
commands:
  uitem:
    description: UItem main command
    usage: /uitem|ui <give|editor|reload|list|rp|craft>
    aliases: [ui]
    permission: uitem.admin
  crafting:
    description: Open the custom crafting table
    aliases: [craft]
permissions:
  craft:
    description: Use /craft and the UItem crafting table (LuckPerms - lp user <player> permission set craft true)
    default: false
  uitem.craft:
    description: Alias of craft — use /craft and the UItem crafting table
    default: false
  uitem.admin:
    description: Full access to UItem
    default: op
    children:
      uitem.give: true
      uitem.editor: true
      uitem.reload: true
      craft: true
      uitem.craft: true
      uitem.potion: true
      uitem.potion.create: true
      uitem.potion.edit: true
      uitem.potion.delete: true
  uitem.give:
    description: Allow giving custom items
    default: op
  uitem.editor:
    description: Allow opening item editor
    default: op
  uitem.reload:
    description: Allow reloading plugin
    default: op
  uitem.search:
    description: Allow using the item search GUI
    default: op
  uitem.potion:
    description: Open Potion Studio GUI
    default: op
  uitem.potion.create:
    description: Create custom potions
    default: op
  uitem.potion.edit:
    description: Edit custom potions
    default: op
  uitem.potion.delete:
    description: Delete custom potions
    default: op

# =============================================================
# UItem Public API
# Entry point: com.uitem.api.UItemAPI
# Events:
#   - UItemCreateEvent   (cancellable)
#   - UItemDeleteEvent   (cancellable)
#   - UItemGiveEvent     (cancellable + modifiable amount/itemstack)
#   - UItemInteractEvent (cancellable)
#   - UItemPickupEvent   (cancellable)
#   - UItemEquipEvent    (cancellable)
# =============================================================

