name: UItem
version: ${version}
main: com.uitem.UItemPlugin
api-version: '1.21'
folia-supported: true
description: Ultimate Item - Custom item plugin for Minecraft
author: iuaititi
softdepend: [Oraxen, ItemsAdder, SCore, ExecutableItems]
license: Delta Softwares License (DSL) - All Rights Reserved - No Redistribution
commands:
  uitem:
    description: UItem main command
    usage: /uitem|ui <give|editor|reload|list|rp|craft>
    aliases: [ui]
    permission: uitem.admin
  crafting:
    description: Open the UItem crafting table
    aliases: [craft]
permissions:
  craft:
    description: Use /craft and the UItem crafting table (LuckPerms - lp user <player> permission set craft true)
    default: false
  uitem.craft:
    description: Alias of craft — use /craft and the UItem crafting table
    default: false
  uitem.admin:
    description: Full access to UItem
    default: op
    children:
      uitem.give: true
      uitem.editor: true
      uitem.reload: true
      craft: true
      uitem.craft: true
      uitem.passive: true
      uitem.passive.create: true
      uitem.passive.edit: true
      uitem.passive.delete: true
  uitem.give:
    description: Allow giving custom items
    default: op
  uitem.editor:
    description: Allow opening item editor
    default: op
  uitem.reload:
    description: Allow reloading plugin
    default: op
  uitem.search:
    description: Allow using the item search GUI
    default: op
  uitem.passive:
    description: Open Passive Studio and manage custom passives
    default: op
  uitem.passive.create:
    description: Create new passives via GUI
    default: op
  uitem.passive.edit:
    description: Edit existing passives
    default: op
  uitem.passive.delete:
    description: Delete passives
    default: op

# =============================================================
# UItem Public API
# Entry point: com.uitem.api.UItemAPI
# Events:
#   - UItemCreateEvent   (cancellable)
#   - UItemDeleteEvent   (cancellable)
#   - UItemGiveEvent     (cancellable + modifiable amount/itemstack)
#   - UItemInteractEvent (cancellable)
#   - UItemPickupEvent   (cancellable)
#   - UItemEquipEvent    (cancellable)
# =============================================================

